[package]
name = "knn-jni-rs"
version = "0.1.0"
edition = "2021"
description = "Rust JNI bindings for k-NN plugin (faiss, nmslib)"
publish = false

[lib]
name = "opensearchknn_faiss"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"
scopeguard = "1"
once_cell = "1"
thiserror = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
avx512 = []
neon = []

[[bench]]
name = "simd_bench"
harness = false

# faiss_bench requires full native library linkage.
# Run with: KNN_JNI_STATIC=1 cargo bench --bench faiss_bench
# (only works when Faiss C API is available in the link path)
#[[bench]]
#name = "faiss_bench"
#harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
